<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — Khal Wireframe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #e0e0e0;
        display: flex;
        justify-content: center;
        padding: 20px 0;
      }
      .wf-screen {
        width: 375px;
        min-height: 667px;
        background: #f5f5f5;
        border: 2px dashed #ccc;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .wf-header {
        background: #e8e8e8;
        border-bottom: 1px dashed #ccc;
        padding: 12px 16px;
        font-size: 18px;
        font-weight: 600;
        color: #444;
        text-align: center;
      }
      .wf-nav {
        background: #e8e8e8;
        border-bottom: 1px dashed #ccc;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        color: #666;
      }
      .wf-content {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .wf-hero {
        background: #fff;
        border: 1px dashed #999;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
      }
      .wf-hero-title {
        font-size: 24px;
        font-weight: 700;
        color: #444;
        margin-bottom: 8px;
      }
      .wf-hero-sub {
        font-size: 14px;
        color: #888;
      }
      .wf-card {
        background: #fff;
        border: 1px dashed #ccc;
        border-radius: 4px;
        padding: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .wf-img-placeholder {
        width: 64px;
        height: 64px;
        background: #ddd;
        border: 1px dashed #bbb;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .wf-text-placeholder {
        background: #e0e0e0;
        height: 12px;
        border-radius: 2px;
      }
      .wf-text-placeholder.short {
        width: 40%;
      }
      .wf-text-placeholder.medium {
        width: 70%;
      }
      .wf-text-placeholder.full {
        width: 100%;
      }
      .wf-label {
        font-size: 12px;
        color: #888;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .wf-footer {
        font-size: 10px;
        color: #aaa;
        text-align: center;
        padding: 8px;
        border-top: 1px dashed #ddd;
      }
      a.wf-link {
        color: inherit;
        text-decoration: none;
        display: contents;
      }
      a.wf-link:hover {
        opacity: 0.7;
      }
      .wf-back {
        font-size: 14px;
        color: #666;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wf-screen">
      <div class="wf-nav">
        <span>khal</span>
        <span>— Lash artist —</span>
        <span></span>
      </div>
      <div class="wf-header">khal — Turnos</div>

      <div class="wf-content">
        <!-- Hero -->
        <div class="wf-hero">
          <div class="wf-hero-title">Pestañas perfectas,<br />turnos sin vueltas</div>
          <div class="wf-hero-sub">Elegí tu servicio y reservá en 30 segundos</div>
        </div>

        <div class="wf-label">Catálogo de servicios (3 activos):</div>

        <!-- Servicio 1 -->
        <a href="servicio-detalle.html" class="wf-link">
          <div class="wf-card">
            <div class="wf-img-placeholder"></div>
            <div style="flex: 1">
              <div class="wf-text-placeholder medium" style="margin-bottom: 6px"></div>
              <div class="wf-text-placeholder full" style="margin-bottom: 4px"></div>
              <div style="display: flex; justify-content: space-between">
                <span style="font-size: 12px; color: #888">$25.000 · 90 min</span>
                <span style="font-size: 12px; color: #999">→ Detalle</span>
              </div>
            </div>
          </div>
        </a>

        <!-- Servicio 2 -->
        <a href="servicio-detalle.html" class="wf-link">
          <div class="wf-card">
            <div class="wf-img-placeholder"></div>
            <div style="flex: 1">
              <div class="wf-text-placeholder medium" style="margin-bottom: 6px"></div>
              <div class="wf-text-placeholder full" style="margin-bottom: 4px"></div>
              <div style="display: flex; justify-content: space-between">
                <span style="font-size: 12px; color: #888">$18.000 · 60 min</span>
                <span style="font-size: 12px; color: #999">→ Detalle</span>
              </div>
            </div>
          </div>
        </a>

        <!-- Servicio 3 -->
        <a href="servicio-detalle.html" class="wf-link">
          <div class="wf-card">
            <div class="wf-img-placeholder"></div>
            <div style="flex: 1">
              <div class="wf-text-placeholder medium" style="margin-bottom: 6px"></div>
              <div class="wf-text-placeholder full" style="margin-bottom: 4px"></div>
              <div style="display: flex; justify-content: space-between">
                <span style="font-size: 12px; color: #888">$15.000 · 45 min</span>
                <span style="font-size: 12px; color: #999">→ Detalle</span>
              </div>
            </div>
          </div>
        </a>
      </div>

      <div class="wf-footer">home — UC-001</div>
    </div>
  </body>
</html>
