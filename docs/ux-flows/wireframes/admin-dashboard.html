<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — Khal Wireframe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #e0e0e0;
        display: flex;
        justify-content: center;
        padding: 20px 0;
      }
      .wf-screen {
        width: 375px;
        min-height: 667px;
        background: #f5f5f5;
        border: 2px dashed #ccc;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .wf-nav {
        background: #e8e8e8;
        border-bottom: 1px dashed #ccc;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        color: #666;
      }
      .wf-content {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .wf-title {
        font-size: 20px;
        font-weight: 600;
        color: #444;
      }
      .wf-stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .wf-stat {
        background: #fff;
        border: 1px dashed #ccc;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
      }
      .wf-stat-num {
        font-size: 24px;
        font-weight: 700;
        color: #444;
      }
      .wf-stat-label {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }
      .wf-menu-item {
        background: #fff;
        border: 1px dashed #ccc;
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        color: #444;
        border-radius: 4px;
      }
      .wf-menu-item + .wf-menu-item {
        border-top: none;
      }
      .wf-arrow {
        color: #999;
        font-size: 18px;
      }
      .wf-footer {
        font-size: 10px;
        color: #aaa;
        text-align: center;
        padding: 8px;
        border-top: 1px dashed #ddd;
      }
      a.wf-link {
        color: inherit;
        text-decoration: none;
        display: contents;
      }
      a.wf-link:hover {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="wf-screen">
      <div class="wf-nav">
        <span>khal admin</span>
        <span>Hola, Ornella</span>
        <a href="admin-login.html" class="wf-link"
          ><span style="font-size: 13px; color: #999">Salir</span></a
        >
      </div>

      <div class="wf-content">
        <div class="wf-title">Hoy, sábado 18</div>

        <div class="wf-stat-grid">
          <div class="wf-stat">
            <div class="wf-stat-num">4</div>
            <div class="wf-stat-label">turnos hoy</div>
          </div>
          <div class="wf-stat">
            <div class="wf-stat-num">2</div>
            <div class="wf-stat-label">señas pendientes</div>
          </div>
        </div>

        <div style="border: 1px dashed #ccc; border-radius: 4px; overflow: hidden; margin-top: 8px">
          <a href="admin-dashboard.html" class="wf-link">
            <div class="wf-menu-item">
              <span>Calendario de turnos</span>
              <span class="wf-arrow">→</span>
            </div>
          </a>
          <a href="admin-servicios.html" class="wf-link">
            <div class="wf-menu-item">
              <span>Servicios (catálogo)</span>
              <span class="wf-arrow">→</span>
            </div>
          </a>
          <a href="admin-dashboard.html" class="wf-link">
            <div class="wf-menu-item">
              <span>Bloqueos de horario</span>
              <span class="wf-arrow">→</span>
            </div>
          </a>
          <a href="admin-dashboard.html" class="wf-link">
            <div class="wf-menu-item">
              <span>Clientas</span>
              <span class="wf-arrow">→</span>
            </div>
          </a>
          <a href="admin-dashboard.html" class="wf-link">
            <div class="wf-menu-item">
              <span>Configuración</span>
              <span class="wf-arrow">→</span>
            </div>
          </a>
        </div>
      </div>

      <div class="wf-footer">admin-dashboard — UC-003 success</div>
    </div>
  </body>
</html>
