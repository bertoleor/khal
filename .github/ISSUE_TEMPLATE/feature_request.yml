name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe it below.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? Who benefits?
    required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Any alternatives considered?
    required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical (blocker)
        - P1 - High (needed soon)
        - P2 - Medium (nice to have)
        - P3 - Low (someday)
    required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Frontend/UI
        - label: Backend/API
        - label: Database
        - label: Payments
        - label: Admin Panel
        - label: DevOps/Infra
    required: false
