name: CI

on:
  push:
    branches: [main, develop, "khal/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # Turborepo Remote Cache via OIDC — short-lived tokens minted per run, no secrets.
    # Needs the team-side Turborepo CLI OIDC policy + TURBO_TEAM repo variable.
    env:
      TURBO_SCM_BASE: origin/main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: --affected needs the merge-base against TURBO_SCM_BASE.
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
                    run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec turbo run lint --affected
      - name: Typecheck
        run: pnpm exec turbo run typecheck --affected
      - name: Format check
        run: pnpm format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_SCM_BASE: origin/main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
                    run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm exec turbo run test --affected

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
                    run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # KHAL-A6: the e2e suite is no longer vacuous. The Playwright webServer
      # boots the zero-dep Supabase REST stub (apps/web/e2e/server.mjs) which
      # spawns `next dev` on port 3100 with Supabase env vars pointing at the
      # stub — real specs run against deterministic fixtures, no live systems.
      # With the booking happy-path spec committed, this job now exercises
      # the booking flow instead of passing vacuously.
      - name: Run E2E
        run: pnpm e2e

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run npm audit
        run: npm audit --audit-level=high || true

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scasbom:
    name: Trivy SCA/SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Trivy
        # aquasecurity/trivy-action 0.35.0 (SHA-pinned) — org previa "aquasec/" no existe;
        # version >=0.35.0 verificada limpia tras los supply-chain incidents de 2026-03
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          path: .
          exit-code: 1
          ignore-unfixed: true

  sast-semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
  supply-sign:
    name: SBOM sign (Sigstore keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          path: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0
      - name: Cosign install
        uses: sigstore/cosign-installer@v3
      - name: Sign SBOM
        run: cosign sign-blob --yes sbom.cdx.json --output-signature sbom.cdx.sig --output-certificate sbom.cdx.pem
