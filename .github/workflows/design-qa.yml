name: Design QA - Token Validation
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/src/app/globals.css'
      - 'tailwind.config.*'
      - 'theme/**'
  push:
    branches: [ main ]

jobs:
  token-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate design tokens
        run: |
          node E:/Hermes/skills/design/uupm-design-system/scripts/validate-tokens.cjs --dir apps/web/src