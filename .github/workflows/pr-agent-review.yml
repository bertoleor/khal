name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

# [GHA-001 fix 2026-10-23] On a PUBLIC repo the comment trigger is
# attacker-reachable: any GitHub user could fire LLM runs (billing-key
# drain) and feed attacker-controlled PR content to the agent, which then
# posts under the project identity. Runs are now restricted to
# OWNER/MEMBER/COLLABORATOR on both triggers, and the agent lost its
# contents:write — it only posts review comments, never pushes.
permissions:
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: pr_agent_job
    # Outsider guard (GHA-001): the PR author or the comment author must
    # belong to the repo. FIRST_TIME_CONTRIBUTORS and NONE get no LLM run
    # and no token usage.
    if: >
      (github.event_name == 'pull_request'
        && (github.event.pull_request.author_association == 'OWNER'
            || github.event.pull_request.author_association == 'MEMBER'
            || github.event.pull_request.author_association == 'COLLABORATOR'))
      || (github.event_name == 'issue_comment'
        && (github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      - name: PR Agent action step
        id: pragent
        # TODO(supply-chain): pin this image to a digest once the tag is
        # vetted — a mutable tag running with the OPENAI_KEY env is a
        # supply-chain surface (tracked in the quality plan, FQ passes).
        uses: docker://pragent/pr-agent:github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: https://integrate.api.nvidia.com/v1
          CONFIG__MODEL: openai/nvidia/nemotron-3.5-lightning-30b-a3b
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '28000'
          CONFIG__FALLBACK_MODELS: '["openai/z-ai/glm-5.3-flash"]'
          CONFIG__MAX_OUTPUT_TOKENS: '8192'
