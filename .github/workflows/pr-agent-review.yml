name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    name: pr_agent_job
    steps:
      - name: PR Agent action step
        id: pragent
        uses: docker://pragent/pr-agent:github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI__API_BASE: https://integrate.api.nvidia.com/v1
          CONFIG__MODEL: openai/nvidia/nemotron-3.5-lightning-30b-a3b
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '28000'
          CONFIG__FALLBACK_MODELS: '["openai/z-ai/glm-5.3-flash"]'
          CONFIG__MAX_OUTPUT_TOKENS: '8192'
