name: WF Test B Docker

on:
  push:
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  test-b:
    runs-on: ubuntu-latest
    steps:
      - name: pragent docker probe
        uses: docker://pragent/pr-agent:github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
