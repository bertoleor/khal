name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull_requests: write
  contents: write
  checks: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        id: pragent
        uses: The-PR-Agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: https://integrate.api.nvidia.com/v1
          CONFIG.MODEL: openai/nvidia/nemotron-3-super-120b-a12b
          CONFIG.MAX_MODEL_TOKENS: 28000
          CONFIG.FALLBACK_MODELS: '["openai/z-ai/glm-5.3-flash"]'
          pr_reviewer.require_score_review: true
          pr_reviewer.require_security_review: true
          pr_reviewer.require_tests_review: true
          pr_description.publish_labels: true
