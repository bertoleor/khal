schema: spec-driven

context: |
  Tech stack: Next.js App Router (React 19+), TypeScript strict, Tailwind CSS v4, Shadcn/Radix, React Query, React Hook Form + Zod
  Architecture: src/ App Router, path aliases (@/), Server Actions as public endpoints, Supabase (RLS, UTC, soft deletes, audit logs)
  Testing: Vitest (unit), Testing Library (integration), Playwright + axe-core (E2E), 80% coverage baseline, sad paths mandatory
  Source of truth: docs/agent-constitution.md v3.1 (154 rules, 43 sections)

strict_tdd: false

testing:
  unit: vitest run            # pnpm test — includes packages/**/test and apps/**/test
  e2e: playwright test        # pnpm e2e — testDir apps/web/e2e
  lint: eslint . --max-warnings 0
  typecheck: turbo run typecheck
  format: prettier
  coverage: none              # no coverage config; 80% baseline declared but not enforced

projects:
  - path: apps/web
    stack: Next.js 15 (React 19, next-intl v3)
    test_command: ""          # no unit test script; covered by root vitest glob
  - path: apps/admin
    stack: Next.js 15 (React 19, next-intl v4)
    test_command: ""          # no unit test script; covered by root vitest glob
  - path: apps/api-workers
    stack: TypeScript module
    test_command: "vitest run"
  - path: packages/db
    stack: TypeScript module
    test_command: "vitest run"
  - path: packages/types
    stack: TypeScript module
    test_command: ""
  - path: packages/ui
    stack: TypeScript module
    test_command: ""
  - path: packages/utils
    stack: TypeScript module
    test_command: "vitest run"
  - path: packages/validations
    stack: TypeScript module (Zod)
    test_command: "vitest run"

rules:
  proposal:
    - Include rollback plan for risky changes (ROLL-01/02/03)
    - Justify any new npm dependency (CQ-05)
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (ARCH-02 structure, 150-line limit CQ-03, no any/escape hatches CQ-06)
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 80   # TEST-01 baseline
  archive:
    - Warn before merging destructive deltas